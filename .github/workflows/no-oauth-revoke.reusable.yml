name: no-oauth-revoke (reusable)

# N18 / P7.1 (C1) — the canonical, REUSABLE version of the no-oauth-revoke
# guard. Hosted once here in the PUBLIC ai-ops-control-plane repo; agent
# repos (and ai-ops-meta itself) call it with a 5-line stub instead of
# vendoring the whole body:
#
#   jobs:
#     no-oauth-revoke:
#       uses: hamlet-archer/ai-ops-control-plane/.github/workflows/no-oauth-revoke.reusable.yml@main
#
# This replaces the copy-paste install path (deploy/templates/no-oauth-revoke.yml
# + the N18.c/.e/.f/.g/.h/.i one-PR-per-repo series). See the P7.0 audit
# (ai-ops-meta/audits/2026-05-26-refactor/ai-ops-common-extraction.md §C1) for
# the duplication catalog and ai-ops-meta/architect-backlog.md §P7.1.
#
# Cross-repo note: ai-ops-control-plane is PUBLIC, so any same-org repo of
# any visibility (including our private agents + ai-ops-meta) can reference
# this workflow with no `Settings → Actions → Access` configuration — public
# reusable workflows are callable by everyone. This is why the canonical copy
# lives here rather than in private ai-ops-meta, where the `organization`
# access level that private→org sharing needs is a Team/Enterprise feature not
# available on the current plan (P7.1.a, 2026-05-28; reversible by deleting
# this file).
#
# Behaviour is identical to the standalone template: it bans the literal
# string `oauth2.googleapis.com/revoke` in the CALLER repo's tracked files.
# Google's revoke endpoint invalidates every refresh_token under the
# (user, GCP project) consent grant — not just the passed token. A 2026-05-27
# incident killed four production tokens (ai-chief, ai-calendar-adviser,
# ai-comms-adviser, email-triage) with a single revoke call against a temp
# write-scope token; ~2h recovery.
#
# Reading (all in ai-ops-meta):
#   - docs/architecture.md §10 (OAuth revoke blast radius bullet)
#   - incidents/2026-05-27-oauth-revoke-cascade-multiservice.md
#   - architect-backlog.md §N18 / §P7
#
# The caller repo supplies its own `scripts/lint-no-oauth-revoke.allowlist`
# (path-prefix entries with `#` justification comments) — the reusable
# job reads it from the checked-out caller tree, exactly as the standalone
# template did.

on:
  workflow_call:
    inputs:
      # Runner selection as a JSON array string. Standing rule in
      # hamlet-archer/qa TESTING.md: CI runs self-hosted, minutes unmetered.
      #
      # The default MUST stay GitHub-hosted: runners are per-repo on a user
      # account, so a [self-hosted, ...] label on a repo with no registered
      # runner queues forever instead of failing. Opting in is the caller's job.
      runs-on:
        type: string
        default: '["ubuntu-latest"]'

jobs:
  no-oauth-revoke:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Grep tracked files for revoke literal
        run: |
          set -euo pipefail
          TARGET='oauth2.googleapis.com/revoke'
          ALLOWLIST_FILE='scripts/lint-no-oauth-revoke.allowlist'

          # Load allowlist (path-prefix matching; comments + blanks skipped).
          allow=""
          if [[ -f "$ALLOWLIST_FILE" ]]; then
            allow=$(grep -v '^\s*#' "$ALLOWLIST_FILE" | grep -v '^\s*$' || true)
          fi

          # Find tracked files containing the literal.
          hits=$(git ls-files -z | xargs -0 grep -lF -- "$TARGET" 2>/dev/null || true)
          if [[ -z "$hits" ]]; then
            echo "no-oauth-revoke: clean — no occurrences of $TARGET in tracked files"
            exit 0
          fi

          # Filter hits through the allowlist (prefix match).
          filtered=""
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            skip=0
            if [[ -n "$allow" ]]; then
              while IFS= read -r prefix; do
                [[ -z "$prefix" ]] && continue
                case "$f" in
                  "$prefix"*) skip=1; break ;;
                esac
              done <<< "$allow"
            fi
            [[ $skip -eq 0 ]] && filtered+="$f"$'\n'
          done <<< "$hits"

          if [[ -n "$filtered" ]]; then
            echo "::error::Disallowed reference to $TARGET — see ai-ops-meta/docs/architecture.md §10 (OAuth revoke blast radius)."
            echo "Hits:"
            printf '  %s\n' $filtered
            echo
            echo "If the reference is documentation or an allowed audit trail,"
            echo "add the file path-prefix to $ALLOWLIST_FILE with a # justification."
            exit 1
          fi

          echo "no-oauth-revoke: clean — all $TARGET occurrences match allowlist"
