[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ops-control-plane"
version = "0.2.0"
description = "SQLite-backed control plane for the AI Ops fleet — Python port. Mirrors the TypeScript edition (same schema, same ops.db file, same dedupe semantics)."
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "uuid-utils>=0.10.0,<0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ai_ops_control_plane"]

# `_schema.sql` lives inside the package (next to __init__.py) so the
# install discovers it via _load_schema_sql()'s `here / "_schema.sql"`
# branch regardless of whether the wheel was built by Hatch locally or
# by pip when installing from a git URL. The prior `shared-data` rule
# placed the file under sys.prefix/share/, which Hatch honors but pip-
# from-git does not — emit-triage's first git+https install (2026-05-12)
# tripped on `FileNotFoundError: <venv>/lib/python3.10/src/schema.sql`.
# Source of truth is still `../src/schema.sql` at the repo root; the
# package-local copy here is kept in sync via the publish step (and a
# pre-commit check would be reasonable follow-up).

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
