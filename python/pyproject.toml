[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ops-control-plane"
version = "0.1.0"
description = "SQLite-backed control plane for the AI Ops fleet — Python port. Mirrors the TypeScript edition (same schema, same ops.db file, same dedupe semantics)."
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "uuid-utils>=0.10.0,<0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ai_ops_control_plane"]

[tool.hatch.build.targets.wheel.shared-data]
"../src/schema.sql" = "ai_ops_control_plane/_schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
